apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: static-auth
  namespace: app5
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: app5
    serviceAccount: default
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-kv-app5
  namespace: app5
spec:
  type: kv-v2
  mount: demo-kv
  path: envs/development/secrets
  destination:
    name: secretkv
    create: true
  refreshAfter: 2s
  # CRD for Vault authentication
  vaultAuthRef: static-auth
