# caddy-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-server
  namespace: hashibank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy-server
  template:
    metadata:
      labels:
        app: caddy-server
    spec:
      containers:
      - name: caddy
        image: caddy:latest
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: caddy-index
          mountPath: /usr/share/caddy/index.html
          subPath: index.html
        - name: caddy-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: caddy-config
        configMap:
          name: caddy-config
      - name: caddy-index
        configMap:
          name: caddy-config
      - name: caddy-data
        emptyDir: {}
