# ACME Examples: Vault PKI with Caddy and cert-manager

┌─────────────────────────────────────────────────────────────────────────────────┐
│                     🛡️ Certificate Trust Chain Validation                       │
│                                                                                 │
│  Browser Certificate Validation:                                                │
│  ┌────────────────────────────────────────────────────────────────────────────┐ │
│  │                                                                            │ │
│  │  Root CA (Imported to browser trust store):                                │ │
│  │  ├─ Subject: CN=Vault Root CA                                              │ │
│  │  ├─ Issuer: Self-signed                                                    │ │
│  │  ├─ Valid: 10 years                                                        │ │
│  │  └─ Purpose: CA Certificate Signing                                        │ │
│  │                             │                                              │ │
│  │                             ▼ Signs                                        │ │
│  │  Intermediate CA (Vault PKI):                                              │ │
│  │  ├─ Subject: CN=Vault Enterprise as a Intermediate CA                      │ │
│  │  ├─ Issuer: CN=Vault Root CA                                               │ │
│  │  ├─ Valid: 1 year                                                          │ │
│  │  └─ Purpose: End-entity Certificate Signing                                │ │
│  │                             │                                              │ │
│  │                             ▼ Signs                                        │ │
│  │  End-Entity Certificates:                                                  │ │
│  │  ┌─────────────────────────┬─────────────────────────────────────────────┐ │ │
│  │  │    cert-manager         │         Caddy Native ACME                   │ │ │
│  │  │                         │                                             │ │ │
│  │  │ Subject:                │  Subject:                                   │ │ │
│  │  │ CN=demov2.hashibank.com │  CN=caddy.hashibank.com                     │ │ │
│  │  │                         │  SAN=caddy-hashibank-com.                   │ │ │
│  │  │ Issuer: Intermediate CA │      hashibank.svc.cluster.local            │ │ │
│  │  │ Valid: 30 minutes       │                                             │ │ │
│  │  │ Key: RSA 2048           │  Issuer: Intermediate CA                    │ │ │
│  │  │ Usage: Server Auth      │  Valid: 1 hour (default)                    │ │ │
│  │  │                         │  Key: ECDSA P-256 (Caddy default)           │ │ │
│  │  │ Renewal: cert-manager   │  Usage: Server Auth                         │ │ │
│  │  │ monitors expiration     │                                             │ │ │
│  │  │ and requests renewal    │  Renewal: Caddy monitors expiration         │ │ │
│  │  │ before expiry           │  and automatically renews                   │ │ │
│  │  └─────────────────────────┴─────────────────────────────────────────────┘ │ │
│  └────────────────────────────────────────────────────────────────────────────┘ │
└─────────────────────────────────────────────────────────────────────────────────┘


┌─────────────────────────────────────────────────────────────────────────────────┐
│                      🔄 TLS-ALPN-01 Challenge Validation                        │
│                                                                                 │
│  Step 1: Certificate Request                                                    │
│  ┌─────────────────┐                                   ┌─────────────────────┐  │
│  │  Caddy Client   │────── ACME New-Order ────────────►│   Vault ACME        │  │
│  │                 │       (caddy.hashibank.com)       │   Server            │  │
│  │  IP: xx.xxx.xx.x│◄───── Challenge Response  ────────│                     │  │
│  └─────────────────┘       (TLS-ALPN-01)               └─────────────────────┘  │
│                                                                                 │
│  Step 2: DNS Resolution                                                         │
│  ┌─────────────────┐                                   ┌─────────────────────┐  │
│  │  Vault ACME     │────── DNS Query ─────────────────►│     CoreDNS         │  │
│  │  Server         │       caddy.hashibank.com         │   Custom Config     │  │
│  │                 │◄───── Returns: xx.xxx.xx.x ───────│                     │  │
│  └─────────────────┘                                   └─────────────────────┘  │
│                                                                                 │
│  Step 3: Challenge Validation                                                   │
│  ┌─────────────────┐    ┌─────────────────┐    ┌─────────────────────────────┐  │
│  │  Vault ACME     │    │  NGINX Ingress  │    │     Caddy Pod               │  │
│  │  Server         │    │  Controller     │    │   (TLS-ALPN-01 Handler)     │  │
│  │                 │    │                 │    │                             │  │
│  │ Connects to ────┼───►│ SSL Passthrough │───►│ Serves challenge cert       │  │
│  │ xx.xxx.xx.x:443 │    │ (no TLS term.)  │    │ with ALPN: acme-tls/1       │  │
│  │                 │    │                 │    │                             │  │
│  │ Validates ◄─────┼────┼─────────────────┼────│ Challenge response          │  │
│  │ challenge       │    │                 │    │ contains required token     │  │
│  └─────────────────┘    └─────────────────┘    └─────────────────────────────┘  │
│                                                                                 │
│  Step 4: Certificate Issuance                                                   │
│  ┌─────────────────┐                                   ┌─────────────────────┐  │
│  │  Vault ACME     │◄────── CSR Submission ────────────│   Caddy Client      │  │
│  │  Server         │        (Certificate Signing       │                     │  │
│  │                 │         Request)                  │                     │  │
│  │ Issues cert ────┼────── X.509 Certificate ─────────►│ Stores in           │  │
│  │ via PKI role    │       + Certificate Chain         │ /data/caddy/acme/   │  │
│  │ "acme"          │                                   │                     │  │
│  └─────────────────┘                                   └─────────────────────┘  │
└─────────────────────────────────────────────────────────────────────────────────┘